# Keycloak/Quarkus datasource tuning baked into the image (conf/quarkus.properties, read at build).
# Purpose: let Neon scale compute to zero (ADR-0025). Quarkus' Agroal pool validates idle
# connections every 2 min by default; Neon suspends only after 5 min without activity, so that
# keeps the compute awake 24/7.
#
# No background validation: idle pooled connections generate no traffic.
quarkus.datasource.jdbc.background-validation-interval=0
# Validate on borrow instead (only connections idle for more than 5 s), so the connection that
# Neon closed on suspend is replaced transparently on the first request after a wake-up rather than
# failing it with HTTP 500.
quarkus.datasource.jdbc.foreground-validation-interval=5S
