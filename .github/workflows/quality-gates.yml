# Reusable quality gates (FR-064, T135): backend build/format/unit/integration tests and frontend
# lint/format/Jest/bundle budget for one commit. Called by ci.yml (every PR and main) and by
# release.yml (the exact commit being released — a hotfix branch included), so nothing reaches a
# published image without passing them.
name: Quality gates

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA (or ref) to check out and test.
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build backend/BirraPoint.sln --configuration Release
      - run: dotnet format backend/BirraPoint.sln --verify-no-changes
      - run: >-
          dotnet test backend/tests/BirraPoint.Api.UnitTests --configuration Release --no-build
          --report-xunit-trx --results-directory "$RUNNER_TEMP/test-results/unit"
      # Testcontainers starts a real PostgreSQL through the runner's Docker daemon.
      - run: >-
          dotnet test backend/tests/BirraPoint.Api.IntegrationTests --configuration Release --no-build
          --report-xunit-trx --results-directory "$RUNNER_TEMP/test-results/integration"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # Jest and the bundle-budget script print their full diagnostics to the job log, so there is no
  # separate artifact (a JUnit reporter would be a new dependency, Principle V).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No dependency lifecycle scripts; the Angular/esbuild toolchain ships prebuilt binaries.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run build:budget
