# Checks of the CI/CD definitions themselves (FR-064, T135): actionlint (with shellcheck, which
# ships on the runner) over every workflow, and the tests of the release scripts. Runs only when
# .github/ changes.
name: Workflows

on:
  pull_request:
    branches: [main]
    paths: ['.github/**']
  push:
    branches: [main]
    paths: ['.github/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install actionlint (checksum-verified release binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
      - run: bash .github/scripts/version.test.sh
