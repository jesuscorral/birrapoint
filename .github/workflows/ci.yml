# Integration pipeline (FR-064a): quality gates on every PR; on main (push or manual run), the
# same gates and then images of all three containers are published to Docker Hub as
# `sha-<short>`, plus `latest` when the commit is still the head of main. Releases (immutable,
# semver-tagged images) are a separate pipeline: release.yml.
#
# Docs-only and version-bump changes are path-ignored: they change no image content, so no run
# (and no publication) happens for them.
name: 1.-CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['version.txt', '**.md']
  push:
    branches: [main]
    paths-ignore: ['version.txt', '**.md']
  workflow_dispatch:

permissions:
  contents: read

# PRs: a newer push cancels the older run. main: runs never overlap, but GitHub keeps only ONE
# pending run per group — a newer push replaces a still-pending one, so the newest commit wins
# and intermediate commits may never be built on main. The head-of-main check in the `images`
# job additionally stops a re-run of an older run from moving `latest` backwards.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Backend and frontend gates, shared with release.yml.
  gates:
    uses: ./.github/workflows/quality-gates.yml
    with:
      ref: ${{ github.sha }}

  images:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: birrapoint-api
            context: backend
            dockerfile: backend/src/BirraPoint.Api/Dockerfile
          - name: birrapoint-web
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: birrapoint-keycloak
            context: infra/keycloak
            dockerfile: infra/keycloak/Dockerfile
    env:
      # Only main publishes; PR builds (including forks, which get no secrets) just prove the image
      # builds, and read the layer cache without writing to it (the repository's 10 GB Actions
      # cache quota is kept for main's entries, the only ones every run can reuse).
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      # Credentials kept: the head-of-main check below runs `git ls-remote origin`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify publish configuration
        if: env.PUBLISH == 'true'
        env:
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
        run: |
          if [ -z "$IMAGE_NAMESPACE" ]; then
            echo "::error::Repository variable IMAGE_NAMESPACE (Docker Hub user/org) is not set."
            exit 1
          fi
      # All actions are pinned to full commit SHAs (the docker/* ones see the Docker Hub token);
      # Dependabot (.github/dependabot.yml) keeps the pins current.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ vars.IMAGE_NAMESPACE }}/${{ matrix.name }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          {
            echo 'tags<<TAGS'
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            if [ "$head" = "$GITHUB_SHA" ]; then
              echo "${IMAGE}:latest"
            else
              echo "::notice::${GITHUB_SHA::7} is no longer the head of main (${head::7}); not moving latest." >&2
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags || format('{0}:pr-check', matrix.name) }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,scope={0},mode=max', matrix.name) || '' }}
