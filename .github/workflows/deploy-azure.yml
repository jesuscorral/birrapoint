# Deploy pipeline (FR-064c, T136, T143). Manually triggered, approval-gated: runs the full
# Terraform apply (infra/azure/terraform) for the azure-production environment with the released image
# versions (<ns>/birrapoint-<component>-release:X.Y.Z, published by release.yml). Terraform owns
# the running image, so a rollout is an apply with other versions; rollback = run it again with the
# previous version. State lives in HCP Terraform (Local execution mode: it only stores state; the
# apply runs here with the Azure OIDC identity). Only runs when dispatched from main (the
# `azure-production` environment is also restricted to main). Setup: infra/github-actions-setup.md.
name: 3.-Deploy (Azure)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z for all three components
        type: string
        required: true
      api_version:
        description: Optional override for the API (X.Y.Z)
        type: string
        required: false
      web_version:
        description: Optional override for the web app (X.Y.Z)
        type: string
        required: false
      keycloak_version:
        description: Optional override for Keycloak (X.Y.Z)
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Validates the inputs - and that the release images exist - before anyone is asked to approve.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.versions.outputs.release }}
      api: ${{ steps.versions.outputs.api }}
      web: ${{ steps.versions.outputs.web }}
      keycloak: ${{ steps.versions.outputs.keycloak }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Deploy workflow from main (\"Use workflow from: main\")."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            infra/azure/terraform/environments
          persist-credentials: false
      - name: Resolve versions
        id: versions
        env:
          VERSION: ${{ inputs.version }}
          API_VERSION: ${{ inputs.api_version }}
          WEB_VERSION: ${{ inputs.web_version }}
          KEYCLOAK_VERSION: ${{ inputs.keycloak_version }}
        run: |
          release="$(.github/scripts/version.sh validate "$VERSION")"
          api="$(.github/scripts/version.sh validate "${API_VERSION:-$VERSION}")"
          web="$(.github/scripts/version.sh validate "${WEB_VERSION:-$VERSION}")"
          keycloak="$(.github/scripts/version.sh validate "${KEYCLOAK_VERSION:-$VERSION}")"
          {
            echo "release=$release"
            echo "api=$api"
            echo "web=$web"
            echo "keycloak=$keycloak"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Deployment request'
            echo
            echo '| Component | Version |'
            echo '|---|---|'
            echo "| keycloak | $keycloak |"
            echo "| api | $api |"
            echo "| web | $web |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the release images exist
        env:
          BIRRAPOINT_ENVIRONMENT: ${{ vars.BIRRAPOINT_ENVIRONMENT || 'PROD' }}
          API: ${{ steps.versions.outputs.api }}
          WEB: ${{ steps.versions.outputs.web }}
          KEYCLOAK: ${{ steps.versions.outputs.keycloak }}
          # Optional read-only token (private repositories); anonymous otherwise.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
        run: |
          # Same file, same image_namespace as the apply below (ADR-0022): no separate variable.
          varfile="infra/azure/terraform/environments/${BIRRAPOINT_ENVIRONMENT,,}.tfvars"
          if [ ! -f "$varfile" ]; then
            echo "::error::$varfile does not exist (BIRRAPOINT_ENVIRONMENT=$BIRRAPOINT_ENVIRONMENT)."
            exit 1
          fi
          IMAGE_NAMESPACE="$(sed -n 's/^image_namespace[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' "$varfile")"
          if [ -z "$IMAGE_NAMESPACE" ] || [ "${IMAGE_NAMESPACE^^}" = "CHANGE-ME" ]; then
            echo "::error::image_namespace in $varfile is unset or still the CHANGE-ME placeholder."
            exit 1
          fi
          missing=0
          for pair in "keycloak:$KEYCLOAK" "api:$API" "web:$WEB"; do
            component="${pair%%:*}" version="${pair#*:}"
            status=0
            .github/scripts/dockerhub-tag-exists.sh "$IMAGE_NAMESPACE" "birrapoint-$component-release" "$version" || status=$?
            case "$status" in
              0) ;;
              1) echo "::error::$IMAGE_NAMESPACE/birrapoint-$component-release:$version does not exist (run the Release workflow first)."; missing=1 ;;
              *) exit 1 ;;
            esac
          done
          exit "$missing"

  deploy:
    needs: resolve
    # Defence in depth next to the environment's main-only branch policy: the production Azure
    # identity trusts the `azure-production` environment, so no other branch may reach this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # One production rollout at a time, never cancelled halfway; held only once approved.
    concurrency:
      group: deploy-azure-production
      cancel-in-progress: false
    # Required reviewers are configured on this environment (infra/github-actions-setup.md); its
    # secrets hold the Azure OIDC identity, which needs Contributor plus User Access Administrator
    # (or RBAC Administrator) on the subscription or resource group, since it runs the whole apply.
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    env:
      # Resources are named birrapoint-<environment>-<acronym> (ADR-0021); PROD unless overridden.
      BIRRAPOINT_ENVIRONMENT: ${{ vars.BIRRAPOINT_ENVIRONMENT || 'PROD' }}
      VERSION: ${{ needs.resolve.outputs.release }}
      API_VERSION: ${{ needs.resolve.outputs.api }}
      WEB_VERSION: ${{ needs.resolve.outputs.web }}
      KEYCLOAK_VERSION: ${{ needs.resolve.outputs.keycloak }}
      # azurerm authenticates with the OIDC token of this job (no client secret).
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # HCP Terraform state backend (cloud {} block in versions.tf).
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_IN_AUTOMATION: 'true'
      # Secret Terraform inputs only: every non-secret one comes from the committed
      # environments/<environment>.tfvars, shared with local applies (ADR-0022).
      # Optional: only when the Neon API key spans several organizations. Empty means the key's
      # default organization (main.tf turns "" into null).
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      # Optional read-only token so the apps can pull private repositories; this job never gets
      # the read/write token CI and releases push with.
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The azure/login session is for the az calls of the summary step; Terraform authenticates
      # through the ARM_* variables.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: terraform init
        run: terraform -chdir=infra/azure/terraform init -input=false
      # The HCP workspace behind TF_WORKSPACE must hold the requested environment (or be empty on a
      # first deploy): a mismatch would apply one environment over another.
      - name: Check the workspace environment
        run: |
          expected="${BIRRAPOINT_ENVIRONMENT,,}"
          # An unreadable state aborts: only a successful, empty `state list` means a first deploy.
          if ! resources="$(terraform -chdir=infra/azure/terraform state list)"; then
            echo "::error::Could not read the state of HCP workspace $TF_WORKSPACE."
            exit 1
          fi
          actual=""
          if [ -n "$resources" ]; then
            if ! actual="$(terraform -chdir=infra/azure/terraform output -raw environment)" || [ -z "${actual// /}" ]; then
              echo "::error::HCP workspace $TF_WORKSPACE has resources but no readable environment output."
              exit 1
            fi
            actual="${actual,,}"
          fi
          if [ -z "$actual" ]; then
            echo "HCP workspace $TF_WORKSPACE has no deployed environment yet (first deploy)."
          elif [ "$actual" != "$expected" ]; then
            echo "::error::HCP workspace $TF_WORKSPACE holds environment '$actual' but BIRRAPOINT_ENVIRONMENT is '$expected'."
            exit 1
          else
            echo "HCP workspace $TF_WORKSPACE holds environment $actual."
          fi
      - name: terraform apply
        run: |
          varfile="environments/${BIRRAPOINT_ENVIRONMENT,,}.tfvars"
          if [ ! -f "infra/azure/terraform/$varfile" ]; then
            echo "::error::infra/azure/terraform/$varfile does not exist (BIRRAPOINT_ENVIRONMENT=$BIRRAPOINT_ENVIRONMENT)."
            exit 1
          fi
          terraform -chdir=infra/azure/terraform apply -input=false -auto-approve \
            -var-file="$varfile" \
            -var "release_version=$VERSION" \
            -var "api_version=$API_VERSION" \
            -var "web_version=$WEB_VERSION" \
            -var "keycloak_version=$KEYCLOAK_VERSION"
      # Terraform returns when the platform accepted the revisions; this waits until they run.
      - name: Revision health gate
        env:
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          prefix="birrapoint-${BIRRAPOINT_ENVIRONMENT,,}"
          bash .github/scripts/wait-revisions.sh "$prefix-rg" "$prefix-kc" "$prefix-api" "$prefix-web"
      - name: Summary
        if: always()
        env:
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
        run: |
          prefix="birrapoint-${BIRRAPOINT_ENVIRONMENT,,}"
          rg="$prefix-rg"
          {
            echo '## Production after this run'
            echo
            echo '| App | Latest revision | Serving revision | Serving image |'
            echo '|---|---|---|---|'
            for app in "$prefix-kc" "$prefix-api" "$prefix-web"; do
              if ! state="$(az containerapp show --name "$app" --resource-group "$rg" --output tsv \
                --query '[properties.latestRevisionName, properties.latestReadyRevisionName]' 2>&1)"; then
                echo "| $app | (could not read: ${state//$'\n'/ }) | | |"
                continue
              fi
              latest="$(echo "$state" | sed -n 1p)" ready="$(echo "$state" | sed -n 2p)"
              image='(none)'
              if [ -n "$ready" ]; then
                image="$(az containerapp revision show --name "$app" --resource-group "$rg" --revision "$ready" \
                  --query 'properties.template.containers[0].image' --output tsv 2>&1)" || image="(could not read)"
              fi
              echo "| $app | $latest | ${ready:-(none)} | \`$image\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
