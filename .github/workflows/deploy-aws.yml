# Deploy pipeline for AWS (FR-064c, T146, ADR-0023). Manually triggered, approval-gated: runs the
# full Terraform apply (infra/aws/terraform) for the aws-production environment with the released
# image versions (<ns>/birrapoint-<component>-release:X.Y.Z, published by release.yml). Terraform
# owns the running image, so a rollout is an apply with other versions; rollback = run it again with
# the previous version. State lives in HCP Terraform, in the AWS root's own workspace (Local
# execution mode: it only stores state; the apply runs here with the AWS OIDC role). Only runs when
# dispatched from main (the `aws-production` environment is also restricted to main). Independent
# from deploy-azure.yml. Setup: infra/aws/github-actions-setup.md.
name: 3.-Deploy (AWS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z for all three components
        type: string
        required: true
      api_version:
        description: Optional override for the API (X.Y.Z)
        type: string
        required: false
      web_version:
        description: Optional override for the web app (X.Y.Z)
        type: string
        required: false
      keycloak_version:
        description: Optional override for Keycloak (X.Y.Z)
        type: string
        required: false

permissions:
  contents: read

jobs:
  # Validates the inputs - and that the release images exist - before anyone is asked to approve.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.versions.outputs.release }}
      api: ${{ steps.versions.outputs.api }}
      web: ${{ steps.versions.outputs.web }}
      keycloak: ${{ steps.versions.outputs.keycloak }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Deploy workflow from main (\"Use workflow from: main\")."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            infra/aws/terraform/environments
          persist-credentials: false
      - name: Resolve versions
        id: versions
        env:
          VERSION: ${{ inputs.version }}
          API_VERSION: ${{ inputs.api_version }}
          WEB_VERSION: ${{ inputs.web_version }}
          KEYCLOAK_VERSION: ${{ inputs.keycloak_version }}
        run: |
          release="$(.github/scripts/version.sh validate "$VERSION")"
          api="$(.github/scripts/version.sh validate "${API_VERSION:-$VERSION}")"
          web="$(.github/scripts/version.sh validate "${WEB_VERSION:-$VERSION}")"
          keycloak="$(.github/scripts/version.sh validate "${KEYCLOAK_VERSION:-$VERSION}")"
          {
            echo "release=$release"
            echo "api=$api"
            echo "web=$web"
            echo "keycloak=$keycloak"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Deployment request'
            echo
            echo '| Component | Version |'
            echo '|---|---|'
            echo "| keycloak | $keycloak |"
            echo "| api | $api |"
            echo "| web | $web |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the release images exist
        env:
          BIRRAPOINT_ENVIRONMENT: ${{ vars.BIRRAPOINT_ENVIRONMENT || 'PROD' }}
          API: ${{ steps.versions.outputs.api }}
          WEB: ${{ steps.versions.outputs.web }}
          KEYCLOAK: ${{ steps.versions.outputs.keycloak }}
          # Optional read-only token (private repositories); anonymous otherwise.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN }}
        run: |
          # Same file, same image_namespace as the apply below (ADR-0022): no separate variable.
          varfile="infra/aws/terraform/environments/${BIRRAPOINT_ENVIRONMENT,,}.tfvars"
          if [ ! -f "$varfile" ]; then
            echo "::error::$varfile does not exist (BIRRAPOINT_ENVIRONMENT=$BIRRAPOINT_ENVIRONMENT)."
            exit 1
          fi
          IMAGE_NAMESPACE="$(sed -n 's/^image_namespace[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' "$varfile")"
          if [ -z "$IMAGE_NAMESPACE" ] || [ "${IMAGE_NAMESPACE^^}" = "CHANGE-ME" ]; then
            echo "::error::image_namespace in $varfile is unset or still the CHANGE-ME placeholder."
            exit 1
          fi
          missing=0
          for pair in "keycloak:$KEYCLOAK" "api:$API" "web:$WEB"; do
            component="${pair%%:*}" version="${pair#*:}"
            status=0
            .github/scripts/dockerhub-tag-exists.sh "$IMAGE_NAMESPACE" "birrapoint-$component-release" "$version" || status=$?
            case "$status" in
              0) ;;
              1) echo "::error::$IMAGE_NAMESPACE/birrapoint-$component-release:$version does not exist (run the Release workflow first)."; missing=1 ;;
              *) exit 1 ;;
            esac
          done
          exit "$missing"

  deploy:
    needs: resolve
    # Defence in depth next to the environment's main-only branch policy: the production AWS role
    # trusts the `aws-production` environment, so no other branch may reach this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # One production rollout at a time, never cancelled halfway; held only once approved.
    concurrency:
      group: deploy-aws-production
      cancel-in-progress: false
    # Required reviewers are configured on this environment (infra/aws/github-actions-setup.md); its
    # secrets hold the role the job assumes through OIDC. It runs the whole apply (VPC, ECS, ALB,
    # CloudFront, IAM roles, Secrets Manager), so it needs broad permissions on a dedicated account.
    environment: aws-production
    permissions:
      contents: read
      id-token: write
    env:
      # Resources are named birrapoint-<environment>-<acronym> (ADR-0021); PROD unless overridden.
      BIRRAPOINT_ENVIRONMENT: ${{ vars.BIRRAPOINT_ENVIRONMENT || 'PROD' }}
      VERSION: ${{ needs.resolve.outputs.release }}
      API_VERSION: ${{ needs.resolve.outputs.api }}
      WEB_VERSION: ${{ needs.resolve.outputs.web }}
      KEYCLOAK_VERSION: ${{ needs.resolve.outputs.keycloak }}
      # Region of the AWS CLI session; the Terraform provider takes its region from the var file
      # (the health gate reads it back from the `region` output).
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      # HCP Terraform state backend (cloud {} block in versions.tf).
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_IN_AUTOMATION: 'true'
      # Secret Terraform inputs only: every non-secret one comes from the committed
      # environments/<environment>.tfvars, shared with local applies (ADR-0022).
      # Optional: only when the Neon API key spans several organizations. Empty means the key's
      # default organization (main.tf turns "" into null).
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      # Lowest-precedence fallback: environments/<environment>.tfvars sets the region.
      TF_VAR_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      # Optional read-only token so the apps can pull private repositories; this job never gets
      # the read/write token CI and releases push with.
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Short-lived credentials from the job's OIDC token (no access keys): the role trusts only this
      # repository's `aws-production` environment. They serve both Terraform (the AWS provider reads
      # the standard environment variables) and the AWS CLI of the health gate.
      # configure-aws-credentials v6.3.0 (commit verified against the upstream tag).
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          role-session-name: birrapoint-deploy-${{ github.run_id }}
          # Apply (CloudFront takes ~15 min) + health gate (up to 30 min) can outlast the 1 h default;
          # the role's maximum session duration is set to 2 h (infra/aws/github-actions-setup.md).
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: terraform init
        run: terraform -chdir=infra/aws/terraform init -input=false
      # The HCP workspace behind TF_WORKSPACE must hold the requested environment (or be empty on a
      # first deploy): a mismatch would apply one environment over another.
      - name: Check the workspace environment
        run: |
          expected="${BIRRAPOINT_ENVIRONMENT,,}"
          # An unreadable state aborts: only a successful, empty `state list` means a first deploy.
          if ! resources="$(terraform -chdir=infra/aws/terraform state list)"; then
            echo "::error::Could not read the state of HCP workspace $TF_WORKSPACE."
            exit 1
          fi
          actual=""
          if [ -n "$resources" ]; then
            if ! actual="$(terraform -chdir=infra/aws/terraform output -raw environment)" || [ -z "${actual// /}" ]; then
              echo "::error::HCP workspace $TF_WORKSPACE has resources but no readable environment output."
              exit 1
            fi
            actual="${actual,,}"
          fi
          if [ -z "$actual" ]; then
            echo "HCP workspace $TF_WORKSPACE has no deployed environment yet (first deploy)."
          elif [ "$actual" != "$expected" ]; then
            echo "::error::HCP workspace $TF_WORKSPACE holds environment '$actual' but BIRRAPOINT_ENVIRONMENT is '$expected'."
            exit 1
          else
            echo "HCP workspace $TF_WORKSPACE holds environment $actual."
          fi
      - name: terraform apply
        run: |
          varfile="environments/${BIRRAPOINT_ENVIRONMENT,,}.tfvars"
          if [ ! -f "infra/aws/terraform/$varfile" ]; then
            echo "::error::infra/aws/terraform/$varfile does not exist (BIRRAPOINT_ENVIRONMENT=$BIRRAPOINT_ENVIRONMENT)."
            exit 1
          fi
          terraform -chdir=infra/aws/terraform apply -input=false -auto-approve \
            -var-file="$varfile" \
            -var "release_version=$VERSION" \
            -var "api_version=$API_VERSION" \
            -var "web_version=$WEB_VERSION" \
            -var "keycloak_version=$KEYCLOAK_VERSION"
      # Terraform returns when ECS accepted the new task definitions; this waits until the services
      # are stable (new tasks running and healthy behind the load balancer, old ones drained). The
      # AWS waiter gives up after 10 minutes, so it is retried a bounded number of times (3 x 10).
      - name: ECS health gate
        run: |
          tf() { terraform -chdir=infra/aws/terraform "$@"; }
          cluster="$(tf output -raw ecs_cluster_name)"
          region="$(tf output -raw region)"
          mapfile -t services < <(tf output -json ecs_service_names | jq -r '.[]')
          if [ -z "$cluster" ] || [ "${#services[@]}" -eq 0 ]; then
            echo "::error::The ecs_cluster_name / ecs_service_names outputs are empty."
            exit 1
          fi
          stable=0
          for attempt in 1 2 3; do
            echo "Waiting for ${services[*]} in $cluster to be stable (attempt $attempt/3)..."
            if aws ecs wait services-stable --region "$region" --cluster "$cluster" --services "${services[@]}"; then
              stable=1
              break
            fi
          done
          if [ "$stable" -ne 1 ]; then
            echo "::error::ECS services in $cluster did not become stable."
            aws ecs describe-services --region "$region" --cluster "$cluster" --services "${services[@]}"               --query 'services[].{service:serviceName,desired:desiredCount,running:runningCount,pending:pendingCount,events:events[0:5].message}'               --output json || true
            exit 1
          fi
          echo "All services are stable."
      - name: Summary
        if: always()
        run: |
          tf() { terraform -chdir=infra/aws/terraform "$@"; }
          {
            echo '## Production after this run'
            echo
            echo '| Component | Version |'
            echo '|---|---|'
            echo "| keycloak | $KEYCLOAK_VERSION |"
            echo "| api | $API_VERSION |"
            echo "| web | $WEB_VERSION |"
            echo
            if web="$(tf output -raw web_url 2>/dev/null)" && keycloak="$(tf output -raw keycloak_url 2>/dev/null)"; then
              echo "- PWA: $web"
              echo "- Keycloak: $keycloak"
            else
              echo '(outputs not available: the apply did not complete)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
